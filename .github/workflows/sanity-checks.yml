name: Sanity checks

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: sanity-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepush:
    name: yarn prepush (${{ matrix.rust_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnu
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl

    defaults:
      run:
        # Bash so Unix-style scripts in package.json (e.g. CARGO_TARGET_DIR=...) work on Windows too.
        shell: bash

    env:
      CARGO_BUILD_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri 2 Debian prerequisites: https://v2.tauri.app/start/prerequisites/
          # (libgtk-3-dev provides gdk-3.0; webkit2gtk pulls most of the rest)
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          if [ "${{ matrix.rust_target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Verify Linux pkg-config modules
        if: runner.os == 'Linux'
        run: |
          # Fail early with a clear list instead of mid-cargo. Extend this when a new .pc shows up.
          missing=0
          for pc in glib-2.0 gdk-3.0 gtk+-3.0 webkit2gtk-4.1 openssl; do
            if pkg-config --exists "$pc"; then
              echo "ok: $pc ($(pkg-config --modversion "$pc"))"
            else
              echo "missing: $pc"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Install the matching -dev packages (see Tauri Linux prerequisites), then re-run."
            exit 1
          fi

      - name: Install MinGW (windows-gnu)
        if: matrix.rust_target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwBins = @(
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\tools\mingw64\bin'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingwBins) {
            throw 'MinGW bin directory not found after chocolatey install'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBins

      - name: Install zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install zip -y --no-progress

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt

      # Windows export-symbol limit workaround (see README prerequisites)
      - name: Configure Cargo linker for Windows (rust-lld)
        if: matrix.rust_target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p "$USERPROFILE/.cargo"
          printf '\n[profile.dev.package."*"]\nopt-level = 3\n' >> "$USERPROFILE/.cargo/config.toml"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust_target }}
          # Matches .cargo/config.toml target-dir (do not change the target dir itself)
          workspaces: ". -> app/src-tauri/target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run yarn prepush
        run: yarn prepush
