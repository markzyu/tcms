name: Sanity checks

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: sanity-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepush:
    name: yarn prepush (${{ matrix.rust_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnu
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl

    defaults:
      run:
        # Bash so Unix-style scripts in package.json (e.g. CARGO_TARGET_DIR=...) work on Windows too.
        shell: bash

    env:
      CARGO_BUILD_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # glib-2.0 headers + pkg-config (see README prerequisites)
          sudo apt-get install -y libglib2.0-dev pkg-config
          if [ "${{ matrix.rust_target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install MinGW (windows-gnu)
        if: matrix.rust_target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwBins = @(
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\tools\mingw64\bin'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingwBins) {
            throw 'MinGW bin directory not found after chocolatey install'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBins

      - name: Install zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install zip -y --no-progress

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt

      # Windows export-symbol limit workaround (see README prerequisites)
      - name: Configure Cargo linker for Windows (rust-lld)
        if: matrix.rust_target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p "$USERPROFILE/.cargo"
          printf '\n[target.x86_64-pc-windows-gnu]\nlinker = "rust-lld"\n\n[profile.dev.package."*"]\nopt-level = 3\n' >> "$USERPROFILE/.cargo/config.toml"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust_target }}
          # Matches .cargo/config.toml target-dir (do not change the target dir itself)
          workspaces: ". -> app/src-tauri/target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run yarn prepush
        run: yarn prepush
