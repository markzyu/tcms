[package]
name = "lcdn-server"
version = "0.1.0"
license = "LGPL-3.0-or-later"
edition = "2024"

[[bin]]
name = "lcdn-standalone"
path = "src/main.rs"

[dependencies]
arc-swap = "1.9.2"
dashmap = "6.2.1"
http = "1.4.2"
mime_guess = "2.0.5"
serde_json = "1.0.150"
serde_with = "3.21.0"
thiserror = "2.0.18"
tower-layer = "0.3.3"
uuid = "1.23.4"

[dependencies.axum]
version = "0.8.9"
features = ["http2"]

[dependencies.chrono]
version = "0.4.45"
features = ["serde"]

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["rustls-no-provider", "json"]

[dependencies.rustls]
version = "0.23.41"
default-features = false
features = ["ring"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.tokio]
version = "1.52.3"
features = ["rt-multi-thread", "signal", "sync"]

[dependencies.tower-http]
version = "0.7.0"
features = ["fs"]

[dependencies.zip]
version = "8.6.0"
default-features = false
features = ["deflate"]

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.25.0"
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies.tokio]
version = "1.52.3"
features = ["macros", "rt-multi-thread"]
